[project]
name = "iot-ids-p1"
version = "0.1.0"
description = "P1 ML foundation for adversarially robust IoT intrusion detection research."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "pydantic>=2",
  "PyYAML>=6",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "psutil>=5.9",
  "python-docx>=1.1",
  "pypdf>=4",
  "scapy>=2.5",
]

[project.optional-dependencies]
models = ["torch>=2.2"]
xai = ["shap>=0.43"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17", "skl2onnx>=1.16"]
dev = ["pytest>=8,<9", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
p1-audit-datasets = "iot_ids.data.audit:main"
iot-ids = "iot_ids.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore::DeprecationWarning:joblib.*",
  "ignore::RuntimeWarning:scipy.stats.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
